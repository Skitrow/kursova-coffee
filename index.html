<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeNet ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root { --sidebar-bg: #1a1d23; --sidebar-hover: #2563eb; --accent: #f59e0b; --accent2: #10b981; --danger: #ef4444; }
        body { background: #f0f2f7; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1d23 0%, #2d3748 50%, #1a1d23 100%); }
        .login-card { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        #app-screen { display: none; }
        .sidebar { height: 100vh; background: var(--sidebar-bg); color: white; position: fixed; width: 260px; z-index: 1000; display: flex; flex-direction: column; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #94a3b8; cursor: pointer; border: none; background: none; width: 100%; text-align: left; border-left: 3px solid transparent; }
        .nav-item:hover { background: #252933; color: #e2e8f0; }
        .nav-item.active { background: #1e3a5f; color: white; border-left-color: var(--accent); }
        .main-content { margin-left: 260px; padding: 28px; min-height: 100vh; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-active, .status-approved { background: #d1fae5; color: #065f46; }
        .status-warning, .status-pending { background: #fef3c7; color: #92400e; }
        .status-error, .status-rejected { background: #fee2e2; color: #991b1b; }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
        .toast-msg { background: #1a202c; color: white; padding: 14px 20px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #10b981; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card" id="auth-box">
        <div class="text-center mb-4">
            <i class="fa-solid fa-mug-hot fa-3x text-warning"></i>
            <h3 class="mt-2" id="auth-title">CoffeeNet ERP</h3>
        </div>
        <div id="auth-error" class="alert alert-danger d-none"></div>
        <form id="login-form">
            <div class="mb-3"><label class="small fw-bold">Email</label><input type="email" id="login-email" class="form-control" required></div>
            <div class="mb-3"><label class="small fw-bold">Пароль</label><input type="password" id="login-password" class="form-control" required></div>
            <button type="button" class="btn btn-primary w-100 mb-2" onclick="login()">Увійти</button>
            <p class="text-center small">Немає акаунту? <a href="#" onclick="toggleAuth(true)">Зареєструвати франшизу</a></p>
        </form>
        <form id="register-form" class="d-none">
            <div class="mb-2"><label class="small fw-bold">ПІБ</label><input type="text" id="reg-name" class="form-control" required></div>
            <div class="mb-2"><label class="small fw-bold">Email</label><input type="email" id="reg-email" class="form-control" required></div>
            <div class="mb-2"><label class="small fw-bold">Телефон</label><input type="text" id="reg-phone" class="form-control" required></div>
            <div class="mb-2"><label class="small fw-bold">Пароль</label><input type="password" id="reg-password" class="form-control" required></div>
            <button type="button" class="btn btn-success w-100 mb-2" onclick="register()">Відправити заявку</button>
            <p class="text-center small">Вже є акаунт? <a href="#" onclick="toggleAuth(false)">Увійти</a></p>
        </form>
    </div>
</div>

<div id="app-screen">
    <div class="sidebar">
        <div class="p-4 border-bottom"><h5>CoffeeNet ERP</h5></div>
        <div class="p-3 small text-white-50" id="user-info">Завантаження...</div>
        <div id="nav-items"></div>
        <button class="mt-auto p-3 btn text-danger text-start" onclick="logout()"><i class="fa-solid fa-sign-out me-2"></i>Вийти</button>
    </div>

    <div class="main-content">
        <div id="dashboard" class="view-section active"><h2>Дашборд</h2><div id="stats-row" class="row g-3"></div></div>
        
        <div id="machines" class="view-section">
            <div class="d-flex justify-content-between mb-3"><h2>Кавомашини</h2><div id="machine-actions"></div></div>
            <div id="machines-grid" class="row g-3"></div>
        </div>

        <div id="users" class="view-section">
            <h2>Керування Користувачами</h2>
            <div class="card shadow-sm"><table class="table mb-0"><thead><tr><th>Ім'я</th><th>Email</th><th>Роль</th><th>Статус</th><th>Дії</th></tr></thead><tbody id="users-table"></tbody></table></div>
        </div>

        <div id="machine-requests" class="view-section">
            <h2>Запити на апарати</h2>
            <div class="card shadow-sm"><table class="table mb-0"><thead><tr><th>Франчайзі</th><th>Модель</th><th>Дата</th><th>Статус</th></tr></thead><tbody id="requests-table"></tbody></table></div>
        </div>

        <div id="orders" class="view-section"><h2>Замовлення</h2><div id="orders-list"></div></div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API = 'http://localhost:5000/api';

function toggleAuth(isReg) {
    document.getElementById('login-form').classList.toggle('d-none', isReg);
    document.getElementById('register-form').classList.toggle('d-none', !isReg);
    document.getElementById('auth-title').innerText = isReg ? 'Реєстрація Франшизи' : 'CoffeeNet ERP';
}

async function login() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    try {
        const res = await fetch(`${API}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.setItem('token', data.token); localStorage.setItem('role', data.role); localStorage.setItem('name', data.name);
        initApp();
    } catch (e) { alert(e.message); }
}

async function register() {
    const payload = { name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value, phone: document.getElementById('reg-phone').value, password: document.getElementById('reg-password').value, role: 'franchisee' };
    try {
        const res = await fetch(`${API}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert(data.message); toggleAuth(false);
    } catch (e) { alert(e.message); }
}

function initApp() {
    const token = localStorage.getItem('token');
    if (!token) return;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    const role = localStorage.getItem('role');
    document.getElementById('user-info').innerText = `${localStorage.getItem('name')} (${role})`;
    let nav = `<button class="nav-item active" onclick="switchView('dashboard')"><i class="fa-solid fa-house"></i> Головна</button><button class="nav-item" onclick="switchView('machines')"><i class="fa-solid fa-server"></i> Апарати</button>`;
    if (role === 'admin') { nav += `<button class="nav-item" onclick="switchView('users')"><i class="fa-solid fa-users"></i> Користувачі</button><button class="nav-item" onclick="switchView('machine-requests')"><i class="fa-solid fa-clipboard-list"></i> Запити</button>`; }
    nav += `<button class="nav-item" onclick="switchView('orders')"><i class="fa-solid fa-cart-shopping"></i> Замовлення</button>`;
    document.getElementById('nav-items').innerHTML = nav;
    switchView('dashboard');
}

async function switchView(v) {
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(v);
    if (target) target.classList.add('active');
    if (v === 'users') loadUsers();
    if (v === 'machines') loadMachines();
    if (v === 'machine-requests') loadRequests();
}

async function loadUsers() {
    const res = await fetch(`${API}/users`, { headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} });
    const users = await res.json();
    document.getElementById('users-table').innerHTML = users.map(u => `
        <tr>
            <td>${u.name}</td><td>${u.email}</td><td>${u.role}</td>
            <td><span class="status-badge status-${u.status}">${u.status}</span></td>
            <td>
                ${u.status === 'pending' ? `<button class="btn btn-sm btn-success" onclick="updateUserStatus(${u.id}, 'approved')">Схвалити</button>` : ''}
                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Видалити</button>
            </td>
        </tr>`).join('');
}

async function updateUserStatus(id, status) {
    await fetch(`${API}/users/${id}/status`, { method: 'PATCH', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`, 'Content-Type': 'application/json'}, body: JSON.stringify({status}) });
    loadUsers();
}

async function deleteUser(id) {
    if (confirm('Видалити користувача?')) {
        await fetch(`${API}/users/${id}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} });
        loadUsers();
    }
}

async function loadMachines() {
    const role = localStorage.getItem('role');
    const actions = document.getElementById('machine-actions');
    actions.innerHTML = role === 'admin' ? '<button class="btn btn-primary" onclick="addMachine()">+ Додати апарат</button>' : '<button class="btn btn-warning" onclick="orderMachine()">Замовити апарат</button>';
    const res = await fetch(`${API}/machines`, { headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} });
    const data = await res.json();
    document.getElementById('machines-grid').innerHTML = data.map(m => `<div class="col-md-4"><div class="card p-3 shadow-sm"><strong>${m.model}</strong><br><small>${m.serial_number}</small><br><span class="status-badge status-active mt-2">${m.status}</span></div></div>`).join('');
}

async function orderMachine() {
    const model = prompt("Яку модель апарату бажаєте замовити?");
    if (!model) return;
    await fetch(`${API}/machine-requests`, { method: 'POST', headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`, 'Content-Type': 'application/json'}, body: JSON.stringify({model}) });
    alert("Запит надіслано адміну!");
}

async function loadRequests() {
    const res = await fetch(`${API}/machine-requests`, { headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} });
    const data = await res.json();
    document.getElementById('requests-table').innerHTML = data.map(r => `<tr><td>${r.franchisee_name}</td><td>${r.model_requested}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td>${r.status}</td></tr>`).join('');
}

function logout() { localStorage.clear(); location.reload(); }
initApp();
</script>
</body>
</html>
