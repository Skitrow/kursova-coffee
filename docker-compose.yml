version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://coffee_user:coffee_pass@postgres:5432/coffee_db
      - DATABASE_URL_MIGRATIONS=postgres://coffee_user:coffee_pass@postgres:5432/coffee_db
      - JWT_SECRET=super_secret_rgr_key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_pass
      POSTGRES_DB: coffee_db
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_user -d coffee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
